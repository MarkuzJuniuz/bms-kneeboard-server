[package]
name = "bms-kneeboard-server"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "bms-briefing-parser"
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[dependencies]
bms-briefing-parser = { path = "bms-briefing-parser" }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
axum = "0.7"
tera = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-type-name = "0.1"
convert_case = "0.6"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
notify = "6.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
tray-icon = "0.13"
bms-sm = { git = "https://github.com/AviiNL/bms-sm" }